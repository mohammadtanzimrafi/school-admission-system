# School Admission System
#
#   docker compose up --build        PostgreSQL + backend + frontend
#
#   Frontend  http://localhost:5173
#   Backend   http://localhost:8080
#
# Optional extras (see README.md):
#   docker compose --profile test run --rm backend-tests     backend automated tests
#   docker compose --profile test run --rm frontend-tests    frontend automated tests
#   docker compose --profile two-backends up --build         second backend on :8081

name: school-admission

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  environment: &backend-environment
    # Database connection. Change it here (or override the variable) to point elsewhere.
    ConnectionStrings__Database: Host=db;Port=5432;Database=school_admission;Username=admission;Password=admission;Maximum Pool Size=40
    # How long a seat stays held before it is released (seconds).
    HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    # Comma-separated list of allowed browser origins, or * for any.
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    volumes:
      # Named volume: data survives `docker compose down` and a later `up`.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      # Where the browser finds the backend. Read when the container starts; no rebuild needed.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Bonus: a second backend process on another port, sharing the same database.
  backend-2:
    <<: *backend
    profiles: ["two-backends"]
    ports:
      - "8081:8080"

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      # Any database on the server will do: each test class creates and drops its own.
      TEST_DATABASE_CONNECTION: Host=db;Port=5432;Database=school_admission;Username=admission;Password=admission
    depends_on:
      db:
        condition: service_healthy

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  db-data:
